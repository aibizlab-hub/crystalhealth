<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF8F3"/>
      <stop offset="55%" stop-color="#F1F4F0"/>
      <stop offset="100%" stop-color="#E3EBE5"/>
    </linearGradient>
    <linearGradient id="sageOrb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D7E4DA"/>
      <stop offset="100%" stop-color="#B6CBBB"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DCEFE2"/>
      <stop offset="100%" stop-color="#43A17A"/>
    </linearGradient>
    <linearGradient id="bottleBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="50%" stop-color="#F7F6F2" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#EDECE6" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-50%" y="-20%" width="200%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#2F4F42" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="640" height="720" fill="url(#bg)"/>

  <!-- large sage orbs -->
  <circle cx="320" cy="350" r="245" fill="url(#sageOrb)" opacity="0.42"/>
  <circle cx="320" cy="350" r="205" fill="url(#sageOrb)" opacity="0.28"/>

  <!-- delicate gold ring -->
  <circle cx="320" cy="350" r="185" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.55"/>
  <circle cx="320" cy="350" r="148" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.35"/>

  <!-- botanical leaves (abstract) -->
  <g stroke="#9BB7A1" stroke-width="2" fill="none" opacity="0.55" stroke-linecap="round">
    <path d="M160,260 Q215,190 285,230 T375,270 T470,310"/>
    <path d="M140,470 Q190,545 270,505 T370,465"/>
    <path d="M180,280 Q150,330 170,380"/>
    <path d="M460,300 Q490,350 470,400"/>
  </g>
  <g fill="#AEC9B4" opacity="0.35">
    <ellipse cx="180" cy="335" rx="14" ry="34" transform="rotate(-25 180 335)"/>
    <ellipse cx="460" cy="350" rx="12" ry="30" transform="rotate(30 460 350)"/>
  </g>

  <!-- central bottle group -->
  <g filter="url(#shadow)">
    <!-- bottle body -->
    <rect x="250" y="170" width="140" height="300" rx="42" fill="url(#bottleBody)"/>
    <!-- bottle neck/cap gold -->
    <rect x="265" y="140" width="110" height="72" rx="16" fill="url(#goldGrad)"/>
    <rect x="278" y="125" width="84" height="28" rx="10" fill="#8FBFA9"/>
    <!-- soft inner shine -->
    <path d="M260 220 Q285 210 310 230 V430 Q285 450 260 435 Z" fill="#FFFFFF" opacity="0.35"/>
  </g>

  <!-- capsules around bottle -->
  <g filter="url(#shadow)">
    <ellipse cx="222" cy="380" rx="18" ry="34" fill="#D4E1D7" transform="rotate(-20 222 380)"/>
    <ellipse cx="232" cy="420" rx="18" ry="34" fill="#43A17A" opacity="0.25" transform="rotate(-20 232 420)"/>
    <ellipse cx="418" cy="370" rx="18" ry="34" fill="#D4E1D7" transform="rotate(20 418 370)"/>
    <ellipse cx="408" cy="410" rx="18" ry="34" fill="#43A17A" opacity="0.25" transform="rotate(20 408 410)"/>
  </g>

  <!-- gold dots / accents -->
  <g fill="url(#goldGrad)" opacity="0.6">
    <circle cx="170" cy="300" r="5"/>
    <circle cx="150" cy="520" r="4"/>
    <circle cx="490" cy="300" r="5"/>
    <circle cx="510" cy="520" r="4"/>
    <circle cx="320" cy="610" r="3"/>
  </g>

  <!-- bottom elegant arc -->
  <path d="M210,575 Q320,615 430,575" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" opacity="0.45" stroke-linecap="round"/>

  <!-- subtle crystal / sparkle -->
  <path d="M320 245 L324 256 L335 260 L324 264 L320 275 L316 264 L305 260 L316 256 Z" fill="url(#goldGrad)" opacity="0.75"/>
</svg>